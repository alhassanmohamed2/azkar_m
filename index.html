<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أذكار المسلم</title>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="css/all.min.css">
  <!-- CSS Code -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Start Header -->
  <header class="header">
    <div class="header-controls">
      <div class="links">
        <span class="icon">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <ul>
          <li><a id="azkar_alsaba7">أذكار الصباح</a></li>
          <li><a id="azkar_almsa2">أذكار المساء</a></li>
          <li><a id="azkar_alslah">أذكار الصلاة</a></li>
          <li><a id="azkar_altshhd">صيغ التشهد </a></li>
          <li><a id="show_history">السجل اليومي</a></li>
          <li><a id="toggle_notifications">تفعيل التنبيهات <i class="fa-solid fa-bell-slash"></i></a></li>
          <li class="slider-container">
            <label for="font-size-slider">حجم الخط</label>
            <input type="range" id="font-size-slider" min="16" max="60" value="26">
          </li>
        </ul>
      </div>
    </div>
    
    <h1 id="ziker_name"></h1>
    
    <div class="header-side" style="flex: 1; display: flex; justify-content: flex-end; gap: 15px; align-items: center;">
      <div class="inapp-notifications">
        <button id="inapp-bell" class="theme-toggle-btn" aria-label="Notifications">
          <i class="fa-solid fa-bell"></i>
          <span id="unread-badge" class="badge hidden"></span>
        </button>
        <div id="notifications-dropdown" class="notifications-dropdown hidden">
          <div class="notifications-header">
            <h3>الإشعارات</h3>
            <button id="clear-notifications">مسح الكل</button>
          </div>
          <div id="notifications-list" class="notifications-list"></div>
        </div>
      </div>
      
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>
  <!-- End Header -->

  <main>
    <div class="background">
      <div class="box">
        <div class="main-text"></div>
        <div id="times"></div>
      </div>
    </div>
  </main>
  
  <footer>
    <div class="progress-bar-container" id="progress-bar"></div>
    
    <div class="footer-controls">
      <p class="completion-text">الإنجاز: <span id="ziker_done_count">0</span> / <span id="totle_ziker">0</span></p>
      
      <div class="footer-center">
        <button id="back" aria-label="السابق"><i class="fa-solid fa-chevron-right"></i></button>
        <button id="counter" aria-label="تسبيح"></button>
        <button id="next" aria-label="التالي"><i class="fa-solid fa-chevron-left"></i></button>
      </div>

      <p class="completion-text" style="opacity: 0;">الإنجاز: 00 / 00</p>
    </div>
  </footer>

  <!-- History Modal -->
  <div id="history-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>السجل اليومي لإنجاز الأذكار</h2>
      <div id="history-stats"></div>
    </div>
  </div>

  <script src="js/all.min.js"></script>
  <!-- JS Code -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
