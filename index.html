<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أذكار المسلم</title>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="css/all.min.css">
  <!-- CSS Code -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
</head>

<body>
  <!-- Start Header -->
  <header class="header">
    <div class="header-controls">
      <div class="links">
        <span class="icon">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <ul>
          <li><a id="azkar_alsaba7">أذكار الصباح</a></li>
          <li><a id="azkar_almsa2">أذكار المساء</a></li>
          <li><a id="azkar_alslah">أذكار الصلاة</a></li>
          <li><a id="azkar_altshhd">صيغ التشهد </a></li>
        </ul>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode">

    </div>
    
    <h1 id="ziker_name"></h1>

  <main>
    <div class="background">
      <div class="box">

        <div id="times"></div>
      </div>
    </div>
  </main>
  
  <footer>
    <p>الذكر <span id="ziker_number"></span> / <span id="totle_ziker"></span></p>
    
    <div class="footer-center">
      <button id="back" aria-label="السابق"><i class="fa-solid fa-chevron-right"></i></button>
      <button id="counter" aria-label="تسبيح"></button>
      <button id="next" aria-label="التالي"><i class="fa-solid fa-chevron-left"></i></button>
    </div>

    <!-- Empty div for flex balance since #times moved inside the box -->
    <p style="opacity: 0;">الذكر 00 / 00</p>
  </footer>

  <script src="js/all.min.js"></script>
  <!-- JS Code -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
